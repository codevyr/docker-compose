services:
  askld:
    image: askld:latest
    environment:
      - ASKL_ALLOW_INSECURE_TOKENS=true
      - ASKL_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ASKL_MAX_UPLOAD_BYTES=2147483648
  codevyr:
    image: codevyr:latest
    environment:
      - NEXT_PUBLIC_ASKLD_URL=http://localhost:3002
