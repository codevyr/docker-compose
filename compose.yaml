services:
  askld:
    image: ghcr.io/codevyr/askld:0.4.0-rc4
    command: ["serve", "--database-url", "postgres://postgres:postgres@db:5432/askl", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - RUST_LOG=info
      - ASKL_BOOTSTRAP_MODE=true
      - ASKL_CORS_ORIGINS=https://ui.codevyr.com
      - ASKL_MAX_UPLOAD_BYTES=2147483648
    ports:
      - "3002:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - db
  db:
    image: postgres:16.14
    # A SIGKILLed postgres restarts through crash recovery, which since PG15
    # discards the in-memory cumulative statistics -- so autovacuum forgets
    # every bulk import and the planner keeps stale estimates.  That cost this
    # deployment a 0.4ms query timing out at 120s.  Two caveats: dockerd
    # ignores this on host reboot or daemon restart, where its own
    # --shutdown-timeout applies (15s default; set "shutdown-timeout" in
    # /etc/docker/daemon.json), and StopTimeout is fixed at container creation,
    # so the container must be recreated for this to take effect.
    stop_grace_period: 120s
    # Docker's default /dev/shm is 64MB.  Postgres puts parallel workers'
    # shared tuple stores there, so a wide parallel scan dies with
    # "could not resize shared memory segment ... No space left on device"
    # long before it runs out of real memory.  1g is well clear of the
    # largest plans this deployment produces.
    shm_size: 1gb
    # Postgres ships defaults sized for a small machine on a rotating disk.
    # The one that matters is random_page_cost=4: it costs an index scan at 4x
    # a sequential page, so the planner preferred hashing all 23M rows of
    # symbol_refs over driving from a few hundred parent instances.  Measured
    # on the amdgpu refs-children statement, work_mem left at the 4MB stock:
    #
    #   random_page_cost=4      3080 ms   read 2.0GB, temp 3.0GB in / 4.7GB out
    #   random_page_cost=1.1      48 ms   read 0,     no temp at all
    #
    # That is ~10GB of I/O per query versus ~100MB, which is what decides it on
    # a memory-constrained host: the fix is the join strategy, and it costs no
    # memory.  Raising work_mem instead only halves the spill (1706 ms) and
    # does need memory, so it is NOT the lever here.  Do not hedge upward --
    # random_page_cost=2.0 already measured 339 ms; 1.1 and 1.5 are equivalent
    # (59 vs 56 ms), so use 1.5 on network-attached storage, 1.1 on local SSD.
    #
    # Sized for a 4 vCPU / 8GB host running the whole stack: askld holds a
    # 256MB SQL cache by default (ASKL_SQL_CACHE_BYTES) and the Next.js
    # frontend wants a few hundred MB, so Postgres gets ~6GB to split between
    # shared_buffers and the OS page cache.  work_mem is per sort/hash node PER
    # parallel worker, so it multiplies -- keep it small.  compose.dev.yaml
    # replaces this whole command with values for a 61GB host.
    command:
      - postgres
      - -c
      - shared_buffers=1536MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      # Bounded separately: up to 3 autovacuum workers run at once, and each
      # would otherwise take maintenance_work_mem.
      - autovacuum_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=askl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10
      # Crash recovery and first-boot initdb both outlast the ~20s the retry
      # budget allows, and depends_on: service_healthy would fail the deploy.
      start_period: 120s
    volumes:
      - askl-db:/var/lib/postgresql/data
    networks:
      - db
  codevyr:
    image: ghcr.io/codevyr/codevyr:0.4.0-rc3
    environment:
      - API_HOST=http://askld:8080
      - NEXT_PUBLIC_ASKLD_URL=${NEXT_PUBLIC_ASKLD_URL:-https://api.codevyr.com}
      - NEXT_PUBLIC_ENABLE_ANALYTICS=true
    ports:
      - "3000:3000"
    networks:
      - app

volumes:
  askl-db:

networks:
  app: {}
  db:
    internal: true
