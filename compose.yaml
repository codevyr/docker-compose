services:
  askld:
    image: ghcr.io/codevyr/askld:0.3.1
    command: ["serve", "--database-url", "postgres://postgres:postgres@db:5432/askl", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - RUST_LOG=info
      - ASKL_BOOTSTRAP_MODE=true
      - ASKL_CORS_ORIGINS=https://ui.codevyr.com
      - ASKL_MAX_UPLOAD_BYTES=2147483648
    ports:
      - "3002:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - db
  db:
    image: postgres:16.14
    # A SIGKILLed postgres restarts through crash recovery, which since PG15
    # discards the in-memory cumulative statistics -- so autovacuum forgets
    # every bulk import and the planner keeps stale estimates.  That cost this
    # deployment a 0.4ms query timing out at 120s.  Two caveats: dockerd
    # ignores this on host reboot or daemon restart, where its own
    # --shutdown-timeout applies (15s default; set "shutdown-timeout" in
    # /etc/docker/daemon.json), and StopTimeout is fixed at container creation,
    # so the container must be recreated for this to take effect.
    stop_grace_period: 120s
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=askl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10
      # Crash recovery and first-boot initdb both outlast the ~20s the retry
      # budget allows, and depends_on: service_healthy would fail the deploy.
      start_period: 120s
    volumes:
      - askl-db:/var/lib/postgresql/data
    networks:
      - db
  codevyr:
    image: ghcr.io/codevyr/codevyr:0.3.4
    environment:
      - API_HOST=http://askld:8080
      - NEXT_PUBLIC_ASKLD_URL=${NEXT_PUBLIC_ASKLD_URL:-https://api.codevyr.com}
      - NEXT_PUBLIC_ENABLE_ANALYTICS=true
    ports:
      - "3000:3000"
    networks:
      - app

volumes:
  askl-db:

networks:
  app: {}
  db:
    internal: true
